plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'  // تأكد من إلغاء التعليق في حالة الحاجة لهذه الإضافة
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace 'com.example.convoo'
    compileSdk = flutter.compileSdkVersion
    ndkVersion "26.3.11579264"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.convo"
        minSdk = flutter.minSdkVersion
        targetSdk = 33  // تأكد من تحديد targetSdk بشكل صحيح
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {

            signingConfig = signingConfigs.debug  // تأكد من إعداد شهادة التوقيع بشكل صحيح للنسخة النهائية
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.facebook.android:facebook-android-sdk:latest.release'  // تحقق من استخدام آخر إصدار من SDK إذا لزم الأمر
}
